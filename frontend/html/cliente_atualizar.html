<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/cliente_atualizar.js" defer></script>
    <title>Cadastrar Cliente - PixelFix</title>
</head>

<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br>
        <hr><br>
        <nav>
            <a href="./cliente_apagar.html">Apagar</a>
            <a href="./cliente_atualizar.html">Atualizar</a>
            <a href="./cliente_cadastrar.html">Cadastrar</a>
            <a href="./cliente_consultar.html">Consultar</a>
            <a href="./cliente_listar.html">Listar</a>
        </nav>
    </header>
    <main>
        <h1>Atualizar Cliente</h1>
        <form>
            <label for="idCliente">ID do Cliente:</label><br>
            <input type="number" id="idCliente" required><br><br>


            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="email">E-mail</label><br>
            <input type="email" id="email" required><br><br>

            <label for="senha">Senha</label><br>
            <input type="password" id="senha" required><br><br>

            <label for="cpf">CPF</label><br>
            <input type="text" id="cpf" required><br><br>

            <label for="telefone">Telefone</label><br>
            <input type="tel" id="telefone" required><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>

</html>
